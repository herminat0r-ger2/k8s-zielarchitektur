<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Hintergrund -->
  <rect x="0" y="0" width="1200" height="900" fill="#020617"/>

  <!-- Titel -->
  <text x="40" y="42" fill="#ffffff" font-size="16" font-weight="700" font-family="'JetBrains Mono', monospace">K8s-Datenbank-Backup — Ablauf</text>
  <text x="40" y="62" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono', monospace">Velero + DB-Konsistenz (Hooks / Stash / Operator) → MinIO · DR-Restore nach Standort B</text>

  <!-- ============ STANDORT A ============ -->
  <rect x="40" y="95" width="720" height="430" rx="12" fill="#0f172a"/>
  <rect x="40" y="95" width="720" height="430" rx="12" fill="rgba(251, 191, 36, 0.05)" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="58" y="117" fill="#fbbf24" font-size="12" font-weight="600" font-family="'JetBrains Mono', monospace">Standort A (Produktion)</text>

  <!-- DB-Pod -->
  <rect x="65" y="150" width="310" height="150" rx="8" fill="#0f172a"/>
  <rect x="65" y="150" width="310" height="150" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="85" y="174" fill="#ffffff" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace">DB-Pod (StatefulSet)</text>
  <text x="85" y="192" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">PostgreSQL · MySQL · MSSQL · ...</text>
  <text x="85" y="210" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">Stash-Sidecar oder</text>
  <text x="85" y="226" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">DB-Operator (CloudNativePG)</text>
  <text x="85" y="246" fill="#34d399" font-size="9" font-family="'JetBrains Mono', monospace">→ konsistenter Dump (pg_dump)</text>

  <!-- Velero -->
  <rect x="415" y="150" width="310" height="150" rx="8" fill="#0f172a"/>
  <rect x="415" y="150" width="310" height="150" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="435" y="174" fill="#ffffff" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace">Velero</text>
  <text x="435" y="192" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">BackupSchedule: 0 1 * * *</text>
  <text x="435" y="210" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">Objekte + PVs + Pre/Post-Hooks</text>
  <text x="435" y="226" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">Label-Selektor: app=postgres</text>

  <!-- Ceph A -->
  <rect x="65" y="340" width="660" height="150" rx="8" fill="#0f172a"/>
  <rect x="65" y="340" width="660" height="150" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="85" y="364" fill="#ffffff" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace">Ceph-Cluster A — RBD-Pool</text>
  <text x="85" y="384" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">PVC = RBD-Image (ceph-csi)</text>
  <text x="85" y="402" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">CSI-Snapshot = RBD-Snapshot (crash-consistent)</text>
  <text x="85" y="422" fill="#a78bfa" font-size="9" font-family="'JetBrains Mono', monospace">DB-Konsistenz kommt aus ② (Dump) — nicht aus dem Snapshot</text>
  <text x="85" y="442" fill="#34d399" font-size="8" font-family="'JetBrains Mono', monospace">Backup-PVC: Sidecar-Dump liegt hier (bei Stash)</text>

  <!-- Pfeile in Standort A -->
  <line x1="220" y1="300" x2="220" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="322" fill="#94a3b8" font-size="8" font-family="'JetBrains Mono', monospace">PVC (RBD)</text>
  <line x1="570" y1="300" x2="570" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="580" y="322" fill="#94a3b8" font-size="8" font-family="'JetBrains Mono', monospace">CSI-Snapshot</text>

  <!-- ============ MINIO ============ -->
  <rect x="40" y="610" width="1120" height="110" rx="8" fill="#0f172a"/>
  <rect x="40" y="610" width="1120" height="110" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="60" y="636" fill="#ffffff" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace">MinIO / S3 — Backup-Ziel</text>
  <text x="60" y="656" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">Velero-Backups (Objekte + Restic/CSI-Daten) · Stash-/Operator-Dumps (konsistent)</text>
  <text x="60" y="676" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">Replikation nach Standort B · Cross-Site-Restore (ISO 27001: Restore-Tests terminieren)</text>

  <!-- Upload-Pfeile -->
  <line x1="395" y1="490" x2="395" y2="610" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="405" y="555" fill="#94a3b8" font-size="8" font-family="'JetBrains Mono', monospace">Upload: Daten (RBD-Snapshots + Dumps)</text>
  <line x1="725" y1="240" x2="835" y2="610" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="690" y="515" fill="#94a3b8" font-size="8" font-family="'JetBrains Mono', monospace">Upload: K8s-Objekte</text>

  <!-- Laufende async Replikation A -> B (Normalbetrieb, KEIN Restore) -->
  <line x1="200" y1="585" x2="990" y2="585" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="595" y="578" fill="#a78bfa" font-size="8" text-anchor="middle" font-family="'JetBrains Mono', monospace">laufende async Replikation (Patroni / RBD-Mirror) — Normalbetrieb</text>

  <!-- ============ STANDORT B ============ -->
  <rect x="840" y="95" width="320" height="430" rx="12" fill="#0f172a"/>
  <rect x="840" y="95" width="320" height="430" rx="12" fill="rgba(251, 191, 36, 0.05)" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="858" y="117" fill="#fbbf24" font-size="12" font-weight="600" font-family="'JetBrains Mono', monospace">Standort B (DR)</text>

  <rect x="860" y="200" width="280" height="160" rx="8" fill="#0f172a"/>
  <rect x="860" y="200" width="280" height="160" rx="8" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="880" y="224" fill="#ffffff" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace">DR-Restore (Velero)</text>
  <text x="880" y="242" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">Objekte + PVs wiederherstellen</text>
  <text x="880" y="258" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">DB aus Backup-Modus zurückholen</text>
  <text x="880" y="274" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">oder Operator: Cluster neu aufbauen</text>
  <text x="880" y="294" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">Ceph-Cluster B als Speicher</text>

  <!-- Restore-Pfeil -->
  <line x1="1140" y1="610" x2="1000" y2="360" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1015" y="540" fill="#94a3b8" font-size="8" font-family="'JetBrains Mono', monospace">Restore (nur DR-Fall / Test)</text>

  <!-- ============ SCHRITT-NUMMERN ============ -->
  <circle cx="570" cy="322" r="11" fill="#22d3ee"/>
  <text x="570" y="326" fill="#020617" font-size="11" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">1</text>

  <circle cx="220" cy="322" r="11" fill="#34d399"/>
  <text x="220" y="326" fill="#020617" font-size="11" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">2</text>

  <circle cx="395" cy="550" r="11" fill="#a78bfa"/>
  <text x="395" y="554" fill="#020617" font-size="11" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">3</text>

  <circle cx="782" cy="425" r="11" fill="#22d3ee"/>
  <text x="782" y="429" fill="#020617" font-size="11" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">4</text>

  <!-- Operator-Notiz -->
  <rect x="40" y="755" width="540" height="65" rx="8" fill="#0f172a"/>
  <rect x="40" y="755" width="540" height="65" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="62" cy="780" r="11" fill="#34d399"/>
  <text x="62" y="784" fill="#020617" font-size="11" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">5</text>
  <text x="84" y="778" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">Optional: DB-Operator macht eigenes Backup</text>
  <text x="84" y="794" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">(konsistenter Dump + WAL/PITR → MinIO), unabhängig von Velero</text>

  <circle cx="1070" cy="485" r="11" fill="#fb7185"/>
  <text x="1070" y="489" fill="#020617" font-size="11" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">6</text>

  <circle cx="990" cy="585" r="11" fill="#a78bfa"/>
  <text x="990" y="589" fill="#020617" font-size="11" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">7</text>

  <!-- Legende -->
  <rect x="620" y="755" width="540" height="135" rx="8" fill="#0f172a"/>
  <rect x="620" y="755" width="540" height="135" rx="8" fill="rgba(30, 41, 59, 0.6)" stroke="#94a3b8" stroke-width="1"/>
  <text x="640" y="778" fill="#ffffff" font-size="10" font-weight="600" font-family="'JetBrains Mono', monospace">Schritte</text>
  <text x="640" y="796" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">1  Backup-Trigger (Velero-Cron)</text>
  <text x="640" y="812" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">2  DB-Konsistenz: Dump via Sidecar/Hook</text>
  <text x="640" y="828" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">3  CSI-Snapshot (RBD) · 4 Upload nach MinIO</text>
  <text x="640" y="844" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace">5  Operator-Backup (optional) · 6 DR-Restore</text>
  <text x="640" y="862" fill="#a78bfa" font-size="9" font-family="'JetBrains Mono', monospace">7  laufende async Replikation (Patroni / RBD-Mirror)</text>
  <text x="640" y="878" fill="#94a3b8" font-size="8" font-family="'JetBrains Mono', monospace">    = Normalbetrieb · 6 Restore nur bei Failover/Test</text>
</svg>
